<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Piano</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main>
    <h1>🎹 Virtual Piano</h1>
    <p class="hint">Click <b>Start Sound</b>, then move your fingertip over a key.</p>

    <div class="video-box">
      <img src="{{ url_for('video_feed') }}" alt="Camera feed">
    </div>

    <section class="controls">
      <button id="startBtn">▶ Start Sound</button>

      <label>Fingers
        <select id="tips">
          <option value="index">Index only</option>
          <option value="all">All fingers</option>
        </select>
      </label>

      <label>Key cooldown: <span id="cdVal">0.20</span>s
        <input type="range" id="cooldown" min="0.05" max="0.6" step="0.05" value="0.2">
      </label>

      <label class="check"><input type="checkbox" id="landmarks" checked> Show hand skeleton</label>
    </section>

    <section class="status">
      <span>Last note: <b id="lastNote">-</b></span>
      <span>FPS: <b id="fps">-</b></span>
      <span id="msg"></span>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
